<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="SkyBranch: grow your org chart" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0%" stop-color="#9aa5bd"/>
      <stop offset="38%" stop-color="#c9b6c6"/>
      <stop offset="68%" stop-color="#f1c3c0"/>
      <stop offset="100%" stop-color="#f8b4a6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#dusk)"/>

  <!-- soft clouds -->
  <ellipse cx="180" cy="48" rx="120" ry="18" fill="#ffffff" opacity="0.30"/>
  <ellipse cx="300" cy="66" rx="90" ry="12" fill="#ffffff" opacity="0.22"/>
  <ellipse cx="620" cy="40" rx="110" ry="14" fill="#ffffff" opacity="0.24"/>

  <!-- ground line -->
  <line x1="0" y1="272" x2="1200" y2="272" stroke="#1d2230" stroke-width="1.5" opacity="0.6"/>

  <!-- tree -->
  <g fill="none" stroke="#1d2230" stroke-linecap="round">
    <path d="M900 272 C 900 232, 897 192, 900 150" stroke-width="12"/>
    <path d="M900 190 C 880 170, 850 160, 820 120" stroke-width="6"/>
    <path d="M850 160 C 830 150, 800 150, 780 130" stroke-width="3"/>
    <path d="M820 120 C 815 100, 800 90, 790 70" stroke-width="2"/>
    <path d="M900 170 C 925 150, 955 140, 990 105" stroke-width="6"/>
    <path d="M955 140 C 975 138, 1000 140, 1030 128" stroke-width="3"/>
    <path d="M990 105 C 995 85, 1010 75, 1020 55" stroke-width="2"/>
    <path d="M900 150 C 900 120, 905 95, 910 70" stroke-width="4"/>
    <path d="M905 100 C 890 90, 880 85, 870 70" stroke-width="2"/>
    <path d="M907 85 C 920 78, 930 72, 940 60" stroke-width="2"/>
  </g>

  <!-- people as leaves -->
  <g fill="#e5806f">
    <circle cx="790" cy="70" r="6"/>
    <circle cx="780" cy="130" r="6"/>
    <circle cx="870" cy="70" r="6"/>
    <circle cx="910" cy="70" r="6"/>
    <circle cx="940" cy="60" r="6"/>
    <circle cx="1020" cy="55" r="6"/>
    <circle cx="1030" cy="128" r="6"/>
  </g>

  <!-- title -->
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
    <text x="70" y="150" font-size="76" font-weight="700" fill="#1d2230">SkyBranch</text>
    <text x="72" y="196" font-size="28" fill="#3a3f55">Grow your org chart.</text>
    <text x="72" y="232" font-size="18" fill="#3a3f55" opacity="0.85">Employee hierarchy manager</text>
  </g>
</svg>
